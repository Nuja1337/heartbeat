<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07090e" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6fa" />
    <title>Heartbeat</title>
    <!-- Theme, text size and contrast before the first paint, from the saved choice or the operating system.
         src/app/state/appearance.ts writes the keys. The script's hash is in public/_headers, and
         src/app/csp.test.ts checks the two agree, so a change here must be followed by a new hash. -->
    <script>
      (function () {
        var d = document.documentElement;
        var t = null;
        var x = null;
        var c = null;
        try {
          var s = localStorage;
          t = s.getItem('hb-theme');
          x = s.getItem('hb-text');
          c = s.getItem('hb-contrast');
        } catch (e) {
          /* No storage: the theme and the contrast come from the operating system. */
        }
        try {
          if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          if (c !== 'high' && matchMedia('(prefers-contrast: more)').matches) c = 'high';
        } catch (e) {
          if (t !== 'dark' && t !== 'light') t = 'dark';
        }
        d.dataset.theme = t;
        if (x === 'large' || x === 'larger') d.dataset.text = x;
        if (c === 'high') d.dataset.contrast = 'high';
      })();
    </script>
    <meta
      name="description"
      content="Heartbeat is a browser aim trainer that records where and how you miss, then suggests drills for your weak spots. There is no account, and everything stays in your browser."
    />
    <meta name="application-name" content="Heartbeat" />
    <meta name="apple-mobile-web-app-title" content="Heartbeat" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Heartbeat" />
    <meta property="og:title" content="Heartbeat, a browser aim trainer" />
    <meta
      property="og:description"
      content="Click targets in time with a beat. Heartbeat records where you miss and suggests drills for your weak spots."
    />
    <meta property="og:url" content="https://heartbeat.ajshaham.workers.dev/" />
    <meta property="og:image" content="https://heartbeat.ajshaham.workers.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Heartbeat wordmark and reticle on a dark field." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Heartbeat, a browser aim trainer" />
    <meta
      name="twitter:description"
      content="Click targets in time with a beat. Heartbeat records where you miss and suggests drills for your weak spots."
    />
    <meta name="twitter:image" content="https://heartbeat.ajshaham.workers.dev/og.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/192.png" />
    <link rel="apple-touch-icon" href="/icons/192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div
        style="
          margin: 0;
          min-height: 100vh;
          display: grid;
          place-items: center;
          padding: 24px;
          background: #07090e;
          color: #eef1f6;
          font:
            15px/1.5 system-ui,
            sans-serif;
          text-align: center;
        "
      >
        <p>Heartbeat needs JavaScript. Turn it on for this site and reload the page.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
